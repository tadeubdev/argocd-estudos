name: Build and Deploy Docker Image

on:
  push:
    tags:
      - 'v*'  # Ex: v1.0.1, v1.0.2...

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from Git tag
        id: extract_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            tadeubarbosa/argocd-estudos:${{ steps.extract_tag.outputs.TAG }}
            tadeubarbosa/argocd-estudos:latest

      - name: Update image in deployment.yaml
        run: |
          sed -i "s|image: tadeubarbosa/argocd-estudos:.*|image: tadeubarbosa/argocd-estudos:${{ steps.extract_tag.outputs.TAG }}|" k8s/deployment.yaml

      - name: Commit and push updated deployment.yaml
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git checkout main  # ou outra branch principal

          git pull origin main

          git add k8s/deployment.yaml
          git commit -m "Atualiza imagem para ${{ steps.extract_tag.outputs.TAG }}" || echo "No changes to commit"
          git push origin main
